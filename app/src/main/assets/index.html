<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>知时 · 学习与工作</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header"><div class="brand"><span class="brand-mark">知</span><div><strong>知时</strong><span>让投入留下痕迹</span></div></div><button id="quick-add" class="icon-button" aria-label="添加学习记录">＋</button></header>
    <main id="main" tabindex="-1"><div class="empty">正在打开你的本地记录…</div></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button data-page="today" class="active"><span>◷</span>今日</button>
      <button data-page="learning"><span>▤</span>学习</button>
      <button data-page="work"><span>▣</span>工作</button>
      <button data-page="tracks"><span>⌁</span>轨迹</button>
      <button data-page="chat"><span>✳</span>AI 助手</button>
      <button data-page="settings"><span>⚙</span>设置</button>
    </nav>
  </div>
  <dialog id="editor"><div id="editor-content"></div></dialog>
  <dialog id="confirm-dialog"><div class="dialog-body"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="actions"><button id="confirm-cancel" class="secondary">取消</button><button id="confirm-ok" class="primary">确认</button></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="domain.js"></script><script src="wiki.js"></script><script src="links.js"></script><script src="conversation.js"></script><script src="tracks.js"></script><script src="compatibility.js"></script><script src="vendor/pdf.min.js"></script><script src="track-ui.js"></script><script src="app.js"></script>
</body>
</html>
